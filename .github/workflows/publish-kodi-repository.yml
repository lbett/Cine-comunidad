name: Publish Kodi repository for Cine Comunidad

on:
  push:
    branches: [main]
    paths:
      - "plugin.video.cinecomunidad/**"
      - "repository.cinecomunidad/**"
      - ".github/workflows/publish-kodi-repository.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Kodi repository website
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("plugin.video.cinecomunidad/addon.xml").getroot().attrib["version"])')"
          mkdir -p site/plugin.video.cinecomunidad site/repository.cinecomunidad
          cp plugin.video.cinecomunidad/addon.xml site/plugin.video.cinecomunidad/
          cp plugin.video.cinecomunidad/addon.py site/plugin.video.cinecomunidad/
          cp plugin.video.cinecomunidad/README.md site/plugin.video.cinecomunidad/
          (cd site && zip -r "plugin.video.cinecomunidad/plugin.video.cinecomunidad-${VERSION}.zip" plugin.video.cinecomunidad)
          cp repository.cinecomunidad/addon.xml site/repository.cinecomunidad/
          (cd site && zip -r "repository.cinecomunidad-${VERSION}.zip" repository.cinecomunidad)
          cp plugin.video.cinecomunidad/addon.xml site/addons.xml
          (cd site && md5sum addons.xml | awk '{print $1}' > addons.xml.md5)
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cine Comunidad — Kodi</title></head>
          <body>
          <h1>Cine Comunidad para Kodi</h1>
          <p>Para instalar el repositorio de Kodi, descargá este archivo:</p>
          <ul>
            <li><a href="repository.cinecomunidad-0.1.0.zip">repository.cinecomunidad-0.1.0.zip</a></li>
            <li><a href="plugin.video.cinecomunidad/plugin.video.cinecomunidad-0.1.0.zip">ZIP del complemento Cine Comunidad</a></li>
          </ul>
          </body></html>
          HTML
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
